<!doctype html>
<html>
<head><meta charset="utf-8"><title>banner with non-essential wording</title></head>
<body>
<h1>University of Fixture</h1>
<!-- OneTrust pattern on UK sites. Both buttons contain a refusal word, one of them negated. -->
<div id="cookie-banner" style="position:fixed;bottom:0;background:#ddd;padding:1em">
  <button onclick="document.title = 'clicked:' + this.textContent">Cookie Settings</button>
  <button onclick="document.title = 'clicked:' + this.textContent">Reject Non-Essential Cookies</button>
  <button onclick="document.title = 'clicked:' + this.textContent">Accept Non-Essential Cookies</button>
</div>
</body>
</html>
