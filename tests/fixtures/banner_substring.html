<!doctype html>
<html>
<head><meta charset="utf-8"><title>banner where no button text is an exact phrase</title></head>
<body>
<h1>University of Fixture</h1>
<div id="cookie-banner" style="position:fixed;bottom:0;background:#ddd;padding:1em">
  We use cookies.
  <button onclick="document.title = 'clicked:' + this.textContent">Accept necessary cookies</button>
  <button onclick="document.title = 'clicked:' + this.textContent">Accept all cookies (recommended)</button>
</div>
</body>
</html>
